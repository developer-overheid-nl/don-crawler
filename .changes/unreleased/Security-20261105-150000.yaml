kind: Security
body: Build the image in two stages and run on `debian:trixie-slim` with only `git` and CA certificates, upgraded on every build, so the curl and Brotli fixes for CVE-2026-111497 and CVE-2026-92392 are included and the Go toolchain no longer ships in the runtime image.
